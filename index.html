<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Site PS2</title>
    <link rel="stylesheet" href="build/style.css">
</head>
<body>

    <section class="produtos">

        <article class="produtos__item" tabindex="0">
            <img class="produtos__imagem" src="src/images/controleps2.jpg" alt="Controle PS2">
            <h3 class="produtos__nome">Controle PS2</h3>
            <p class="produtos__descricao">
                Controle original para PlayStation 2
            </p>
        </article>

        <article class="produtos__item" tabindex="0">
            <img class="produtos__imagem" src="src/images/ps2black.jpg" alt="PS2 Preto">
            <h3 class="produtos__nome">PlayStation 2 Preto</h3>
            <p class="produtos__descricao">
                Console PS2 versão black
            </p>
        </article>

        <article class="produtos__item" tabindex="0">
            <img class="produtos__imagem" src="src/images/ps2prata.jpg" alt="PS2 Prata">
            <h3 class="produtos__nome">PlayStation 2 Prata</h3>
            <p class="produtos__descricao">
                Console PS2 versão prata
            </p>
        </article>

    </section>

</body>
</html>
